openapi: 3.0.0
info:
  title: SEMS API
  version: 1.0.0
  description: Smart Energy Management System Simulation API
servers:
  - url: /
paths:
  /api/v1/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /api/v1/status:
    get:
      summary: Get current station status
      responses:
        '200':
          description: Station status
  /api/v1/simulate/tick:
    post:
      summary: Advance simulation time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                durationMinutes:
                  type: integer
      responses:
        '200':
          description: Tick results
  /api/v1/events/connect:
    post:
      summary: Connect an EV to a connector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                connectorId:
                  type: string
                evMaxPowerKW:
                  type: number
                evBatteryKWh:
                  type: number
                evSoC:
                  type: number
                timestamp:
                  type: string
                  format: date-time
            examples:
              StandardEV:
                summary: Standard EV (150kW, 75kWh, 20% SoC) on conn-1a
                value:
                  connectorId: "conn-1a"
                  evMaxPowerKW: 150
                  evBatteryKWh: 75
                  evSoC: 0.20
              FastEV:
                summary: Fast EV (350kW, 100kWh, 10% SoC) on conn-2a
                value:
                  connectorId: "conn-2a"
                  evMaxPowerKW: 350
                  evBatteryKWh: 100
                  evSoC: 0.10
              SlowEV:
                summary: Slow EV (50kW, 40kWh, 50% SoC) on conn-3a
                value:
                  connectorId: "conn-3a"
                  evMaxPowerKW: 50
                  evBatteryKWh: 40
                  evSoC: 0.50
      responses:
        '200':
          description: Session created
  /api/v1/events/disconnect:
    post:
      summary: Disconnect an EV
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                connectorId:
                  type: string
                timestamp:
                  type: string
                  format: date-time
            examples:
              DisconnectConn1a:
                summary: Disconnect conn-1a
                value:
                  connectorId: "conn-1a"
              DisconnectConn2a:
                summary: Disconnect conn-2a
                value:
                  connectorId: "conn-2a"
      responses:
        '200':
          description: Disconnected
  /api/v1/events/power-update:
    post:
      summary: Update requested power for an active session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                connectorId:
                  type: string
                requestedPowerKW:
                  type: number
                evSoC:
                  type: number
                timestamp:
                  type: string
                  format: date-time
            examples:
              ThrottleConn1a:
                summary: Throttle conn-1a down to 50kW
                value:
                  connectorId: "conn-1a"
                  requestedPowerKW: 50
                  evSoC: 0.60
      responses:
        '200':
          description: Power updated
  /api/v1/station/config:
    post:
      summary: Load station configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            examples:
              DefaultConfig:
                summary: Paris-01 Station (400kW Grid, 4x300kW EVSEs, 200kWh BESS)
                value:
                  id: "station-01"
                  gridLimitKW: 400
                  evses:
                    - id: "evse-1"
                      maxPowerKW: 300
                      connectors:
                        - { "id": "conn-1a", "type": "CCS_DC" }
                        - { "id": "conn-1b", "type": "CCS_DC" }
                    - id: "evse-2"
                      maxPowerKW: 300
                      connectors:
                        - { "id": "conn-2a", "type": "CCS_DC" }
                        - { "id": "conn-2b", "type": "CCS_DC" }
                    - id: "evse-3"
                      maxPowerKW: 300
                      connectors:
                        - { "id": "conn-3a", "type": "CCS_DC" }
                        - { "id": "conn-3b", "type": "CCS_DC" }
                    - id: "evse-4"
                      maxPowerKW: 300
                      connectors:
                        - { "id": "conn-4a", "type": "CCS_DC" }
                        - { "id": "conn-4b", "type": "CCS_DC" }
                  bess:
                    capacityKWh: 200
                    initialSoC: 0.80
                    maxChargePowerKW: 200
                    maxDischargePowerKW: 200
      responses:
        '200':
          description: Configured
